[pytest]
# Rulează din rădăcina repo-ului cu `pytest -c tests/e2e/pytest.ini`, sau
# direct `pytest` din tests/e2e/.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ieșire scurtă: la un test de UI picat, stack trace-ul lung nu ajută —
# contează ce selector n-a fost găsit.
addopts = -v --tb=short --strict-markers

markers =
    auth: needs TESSERA_TEST_EMAIL / TESSERA_TEST_PASSWORD and a working Supabase project (skipped otherwise)
    slow: takes more than a few seconds
